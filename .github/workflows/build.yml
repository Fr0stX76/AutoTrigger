name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build
        run: msbuild AutoTrigger.sln -restore -p:Configuration=Release -p:ContinuousIntegrationBuild=true -m -nologo -v:minimal
      - name: Test
        run: out\Tests\AutoTrigger.Tests.exe
